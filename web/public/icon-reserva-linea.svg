<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
    <defs>
        <style>
            /* Animaciones para Reserva en Línea */
            .reserva-cursor {
                animation: tapReserva 3s ease-in-out infinite;
                transform-origin: 130px 145px;
            }
            .reserva-heart {
                animation: popHeart 3s ease-in-out infinite;
                transform-origin: center;
                transform-box: fill-box;
            }
            @keyframes tapReserva {
                0%, 15% { transform: translate(20px, 30px) rotate(0deg); opacity: 0; }
                25% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
                35%, 45% { transform: translate(-5px, -5px) scale(0.9); opacity: 1; }
                55% { transform: translate(5px, 10px) rotate(5deg); opacity: 1; }
                70%, 100% { transform: translate(30px, 40px); opacity: 0; }
            }
            @keyframes popHeart {
                0%, 35% { transform: scale(0) translateY(10px); opacity: 0; }
                45%, 70% { transform: scale(1) translateY(-10px); opacity: 1; }
                80%, 100% { transform: scale(1.2) translateY(-20px); opacity: 0; }
            }
        </style>
    </defs>

    <!-- Fondo circular (Similar al de tu página) -->
    <circle cx="100" cy="100" r="90" fill="#F0F0F0" />
    <circle cx="100" cy="100" r="80" fill="none" stroke="#D1D1D1" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Teléfono -->
    <rect x="55" y="30" width="90" height="140" rx="15" fill="#EAE0D5" stroke="#422612" stroke-width="6"/>
    <!-- Pantalla -->
    <rect x="63" y="45" width="74" height="110" rx="6" fill="#FFFFFF" stroke="#422612" stroke-width="4"/>
    
    <!-- App UI: Header -->
    <line x1="75" y1="60" x2="125" y2="60" stroke="#422612" stroke-width="5" stroke-linecap="round"/>
    
    <!-- App UI: Croissant en pantalla -->
    <path d="M 75,95 C 75,70 125,70 125,95 C 120,110 80,110 75,95 Z" fill="#EFA045" stroke="#422612" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- App UI: Botón de Compra -->
    <rect x="75" y="125" width="50" height="16" rx="8" fill="#F4B84A" stroke="#422612" stroke-width="3"/>

    <!-- Corazón (Aparece tras el clic) -->
    <g class="reserva-heart">
        <path d="M 100,85 C 90,75 75,90 100,110 C 125,90 110,75 100,85 Z" fill="#FF7492" stroke="#422612" stroke-width="3"/>
    </g>

    <!-- Cursor Animado (Mano) -->
    <g class="reserva-cursor">
        <path d="M 130,145 L 140,175 L 150,170 Z" fill="#FFFFFF" stroke="#422612" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="130" cy="145" r="5" fill="#FFFFFF" stroke="#422612" stroke-width="3"/>
    </g>
</svg>