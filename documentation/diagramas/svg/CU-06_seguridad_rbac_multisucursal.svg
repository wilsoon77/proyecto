<svg id="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620">
      <defs>
        <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1.5 L 9 5 L 0 8.5" fill="none" stroke="#334155" stroke-width="2" />
        </marker>
        
      </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- SYSTEM BOUNDARY -->
      <rect x="210" y="20" width="580" height="580" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" />
      <rect x="210" y="20" width="580" height="38" rx="14" fill="#0f172a" />
      <rect x="210" y="44" width="580" height="14" fill="#0f172a" />
      <text x="500" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">SISTEMA PANADERÍA SVETLANA (MÓDULO SEGURIDAD Y AUTH)</text>

      <!-- ACTOR 1: Usuario / Cliente (Left Top) -->
      <g id="actor-user" transform="translate(25, 75)">
        <rect x="0" y="0" width="155" height="195" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
        <g transform="translate(77, 48)">
          <circle cx="0" cy="0" r="16" fill="#f8fafc" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="16" x2="0" y2="58" stroke="#0f172a" stroke-width="3" />
          <line x1="-24" y1="32" x2="24" y2="32" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="58" x2="-20" y2="92" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="58" x2="20" y2="92" stroke="#0f172a" stroke-width="3" />
        </g>
        <rect x="10" y="148" width="135" height="36" rx="6" fill="#0f172a" />
        <text x="77" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Usuario / Cliente</text>
        <text x="77" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">«Rol CUSTOMER»</text>
        <circle cx="155" cy="98" r="4" fill="#1d4ed8" />
      </g>

      <!-- ACTOR 2: Super Administrador (Left Bottom) -->
      <g id="actor-admin" transform="translate(25, 335)">
        <rect x="0" y="0" width="155" height="195" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
        <g transform="translate(77, 48)">
          <circle cx="0" cy="0" r="16" fill="#f8fafc" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="16" x2="0" y2="58" stroke="#0f172a" stroke-width="3" />
          <line x1="-24" y1="32" x2="24" y2="32" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="58" x2="-20" y2="92" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="58" x2="20" y2="92" stroke="#0f172a" stroke-width="3" />
        </g>
        <rect x="10" y="148" width="135" height="36" rx="6" fill="#0f172a" />
        <text x="77" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Super Administrador</text>
        <text x="77" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">«Rol ADMIN»</text>
        <circle cx="155" cy="98" r="4" fill="#1d4ed8" />
      </g>

      <!-- ACTOR 3: Guards NestJS (Right) -->
      <g id="actor-guards" transform="translate(835, 230)">
        <rect x="0" y="0" width="160" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
        <g transform="translate(80, 35)">
          <path d="M 0 -18 L 24 -9 L 24 15 C 24 30, 0 44, 0 44 C 0 44, -24 30, -24 15 L -24 -9 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3" />
          <path d="M -7 12 L -1 18 L 12 4" fill="none" stroke="#15803d" stroke-width="3" />
        </g>
        <rect x="10" y="108" width="140" height="38" rx="6" fill="#0f172a" />
        <text x="80" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Guards NestJS</text>
        <text x="80" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">«JWT &amp; RolesGuard»</text>
        <circle cx="0" cy="80" r="4" fill="#1d4ed8" />
      </g>

      <!-- USE CASES -->

      <!-- Iniciar Sesión (CORE) -->
      <g id="uc30">
        <rect x="235" y="80" width="240" height="60" rx="30" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" />
        <text x="355" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#92400e" text-anchor="middle">Iniciar Sesión</text>
        <text x="355" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Generar Access + Refresh Token</text>
      </g>

      <!-- Validar Firma JWT -->
      <g id="uc31">
        <rect x="535" y="80" width="235" height="60" rx="30" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5" />
        <text x="652" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1e40af" text-anchor="middle">Validar Token JWT</text>
        <text x="652" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">Verificar Claims y Expiración</text>
      </g>

      <!-- Gestionar Personal -->
      <g id="uc32">
        <rect x="235" y="200" width="240" height="58" rx="29" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
        <text x="355" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Gestionar Personal</text>
        <text x="355" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Asignar Roles: BAKER / MANAGER</text>
      </g>

      <!-- Asignar Sucursal -->
      <g id="uc33">
        <rect x="235" y="325" width="240" height="58" rx="29" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
        <text x="355" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Asignar Sucursal</text>
        <text x="355" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Vincular Usuario a BranchId</text>
      </g>

      <!-- Aislar Datos (CORE) -->
      <g id="uc34">
        <rect x="535" y="260" width="235" height="66" rx="33" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5" />
        <text x="652" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#166534" text-anchor="middle">Aislar Datos</text>
        <text x="652" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">por BranchScopeGuard</text>
      </g>

      <!-- Recuperar Contraseña -->
      <g id="uc35">
        <rect x="235" y="445" width="240" height="58" rx="29" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
        <text x="355" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Recuperar Contraseña</text>
        <text x="355" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Envío de Token Seguro por Email</text>
      </g>

      <!-- CONNECTIONS -->

      <!-- User to UC30 & UC35 -->
      <line x1="180" y1="173" x2="235" y2="110" stroke="#0f172a" stroke-width="2" />
      <line x1="180" y1="173" x2="235" y2="474" stroke="#0f172a" stroke-width="2" />

      <!-- Super Admin to UC32 & UC33 -->
      <line x1="180" y1="433" x2="235" y2="229" stroke="#0f172a" stroke-width="2" />
      <line x1="180" y1="433" x2="235" y2="354" stroke="#0f172a" stroke-width="2" />

      <!-- Iniciar Sesión <<include>> Validar Token -->
      <line x1="475" y1="110" x2="535" y2="110" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
      <rect x="475" y="99" width="60" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="505" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">«include»</text>

      <!-- Personal <<include>> Aislar Datos -->
      <line x1="475" y1="229" x2="535" y2="280" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
      <rect x="475" y="243" width="60" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="505" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">«include»</text>

      <!-- Sucursal <<include>> Aislar Datos -->
      <line x1="475" y1="354" x2="535" y2="305" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
      <rect x="475" y="318" width="60" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="505" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">«include»</text>

      <!-- Guards to UC31 & UC34 -->
      <line x1="770" y1="110" x2="835" y2="310" stroke="#0f172a" stroke-width="2" />
      <line x1="770" y1="293" x2="835" y2="310" stroke="#0f172a" stroke-width="2" />

    </svg>