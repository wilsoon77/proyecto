name: Database Backup (Diario 12:23 AM GT)

on:
  schedule:
    # 00:23 horas (12:23 AM) hora de Guatemala (UTC-6) -> 06:23 UTC
    # Minuto no saturado para evitar los cuellos de botella de GitHub Actions en el minuto :00
    - cron: '23 6 * * *'
  workflow_dispatch: # Permite ejecucion manual en cualquier momento desde GitHub Actions

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup-to-supabase:
    name: Generar Backup y Subir a Supabase Storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './api/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npm run prisma:generate

      - name: Instalar cliente PostgreSQL 17 (pg_dump)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Ejecutar Respaldo de Base de Datos y Rotacion (30 dias)
        env:
          SUPABASE_BACKUP_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_BUCKET_ID: ${{ secrets.SUPABASE_BACKUP_BUCKET_ID || 'database-backups' }}
          BACKUP_RETENTION_DAYS: '30'
        run: node scripts/backup-database.mjs
