<svg id="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620">
      <defs>
        <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1.5 L 9 5 L 0 8.5" fill="none" stroke="#334155" stroke-width="2" />
        </marker>
        
      </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- SYSTEM BOUNDARY -->
      <rect x="210" y="20" width="580" height="580" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" />
      <rect x="210" y="20" width="580" height="38" rx="14" fill="#0f172a" />
      <rect x="210" y="44" width="580" height="14" fill="#0f172a" />
      <text x="500" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">SISTEMA PANADERÍA SVETLANA (MÓDULO CIERRE DE DÍA)</text>

      <!-- ACTOR 1: Encargado de Sucursal (Left) -->
      <g id="actor-encargado" transform="translate(25, 200)">
        <rect x="0" y="0" width="155" height="195" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
        <g transform="translate(77, 48)">
          <circle cx="0" cy="0" r="16" fill="#f8fafc" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="16" x2="0" y2="58" stroke="#0f172a" stroke-width="3" />
          <line x1="-24" y1="32" x2="24" y2="32" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="58" x2="-20" y2="92" stroke="#0f172a" stroke-width="3" />
          <line x1="0" y1="58" x2="20" y2="92" stroke="#0f172a" stroke-width="3" />
        </g>
        <rect x="10" y="148" width="135" height="36" rx="6" fill="#0f172a" />
        <text x="77" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Encargado Sucursal</text>
        <text x="77" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">«Manager / Admin»</text>
        <circle cx="155" cy="98" r="4" fill="#1d4ed8" />
      </g>

      <!-- ACTOR 2: Base de Datos / Sistema Core (Right) -->
      <g id="actor-db" transform="translate(835, 230)">
        <rect x="0" y="0" width="160" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
        <g transform="translate(80, 35)">
          <path d="M -28 0 C -28 -10, 28 -10, 28 0 C 28 10, -28 10, -28 0 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3" />
          <path d="M -28 0 L -28 44 C -28 54, 28 54, 28 44 L 28 0" fill="none" stroke="#0f172a" stroke-width="3" />
          <path d="M -28 22 C -28 32, 28 32, 28 22" fill="none" stroke="#0f172a" stroke-width="2.5" />
        </g>
        <rect x="10" y="108" width="140" height="38" rx="6" fill="#166534" />
        <text x="80" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Motor PostgreSQL</text>
        <text x="80" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#bbf7d0" text-anchor="middle">«Prisma Transaccional»</text>
        <circle cx="0" cy="80" r="4" fill="#166534" />
      </g>

      <!-- USE CASES -->

      <!-- UC1: Seleccionar Sucursal y Fecha -->
      <g id="uc1">
        <rect x="235" y="80" width="240" height="58" rx="29" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
        <text x="355" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Seleccionar Sucursal</text>
        <text x="355" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">y Fecha Operativa</text>
      </g>

      <!-- UC2: Consultar Stock Teórico -->
      <g id="uc2">
        <rect x="535" y="80" width="235" height="58" rx="29" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5" />
        <text x="652" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1e40af" text-anchor="middle">Consultar Stock Teórico</text>
        <text x="652" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">Existencias en Sistema</text>
      </g>

      <!-- UC3: Ingresar Conteo Físico -->
      <g id="uc3">
        <rect x="235" y="185" width="240" height="58" rx="29" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
        <text x="355" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Ingresar Conteo Físico</text>
        <text x="355" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">(Bandejas / Tiras / Unidades)</text>
      </g>

      <!-- UC4: Reportar Mermas -->
      <g id="uc4">
        <rect x="235" y="290" width="240" height="58" rx="29" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
        <text x="355" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Reportar Mermas</text>
        <text x="355" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Pan Dañado / No Vendible</text>
      </g>

      <!-- UC5: Calcular Venta Residual (CORE) -->
      <g id="uc5">
        <rect x="535" y="230" width="235" height="66" rx="33" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" />
        <text x="652" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#92400e" text-anchor="middle">Calcular Venta Residual</text>
        <text x="652" y="277" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Vendido = Stock - Merma - Conteo</text>
      </g>

      <!-- UC6: Confirmar Cierre Diario -->
      <g id="uc6">
        <rect x="235" y="395" width="240" height="58" rx="29" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
        <text x="355" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Confirmar Cierre Diario</text>
        <text x="355" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Bloqueo de Edición Operativa</text>
      </g>

      <!-- UC7: Registrar Movimientos ACID -->
      <g id="uc7">
        <rect x="535" y="455" width="235" height="60" rx="30" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5" />
        <text x="652" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#166534" text-anchor="middle">Registrar Movimientos</text>
        <text x="652" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">Ajuste Transaccional en Inventory</text>
      </g>

      <!-- CONNECTIONS -->

      <!-- Actor to Primary UCs -->
      <line x1="180" y1="298" x2="235" y2="109" stroke="#0f172a" stroke-width="2" />
      <line x1="180" y1="298" x2="235" y2="214" stroke="#0f172a" stroke-width="2" />
      <line x1="180" y1="298" x2="235" y2="319" stroke="#0f172a" stroke-width="2" />
      <line x1="180" y1="298" x2="235" y2="424" stroke="#0f172a" stroke-width="2" />

      <!-- UC1 <<include>> UC2 -->
      <line x1="475" y1="109" x2="535" y2="109" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
      <rect x="475" y="97" width="60" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="505" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">«include»</text>

      <!-- UC3 <<include>> UC5 -->
      <line x1="475" y1="214" x2="535" y2="250" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
      <rect x="475" y="222" width="60" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="505" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">«include»</text>

      <!-- UC4 <<include>> UC5 -->
      <line x1="475" y1="319" x2="535" y2="275" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
      <rect x="475" y="287" width="60" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="505" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">«include»</text>

      <!-- UC6 <<include>> UC7 -->
      <line x1="475" y1="424" x2="535" y2="470" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
      <rect x="475" y="437" width="60" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="505" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">«include»</text>

      <!-- DB Connections -->
      <line x1="770" y1="109" x2="835" y2="310" stroke="#166534" stroke-width="2" />
      <line x1="770" y1="485" x2="835" y2="310" stroke="#166534" stroke-width="2" />

    </svg>