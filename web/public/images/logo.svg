<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="breadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background (Transparent or Off-White) -->
  <rect width="720" height="360" fill="none"/>

  <!-- STEAM RISING (Above Bread) -->
  <g stroke="url(#breadGold)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 470 65 C 462 50 478 40 470 25" />
    <path d="M 490 58 C 482 43 498 33 490 18" />
    <path d="M 510 65 C 502 50 518 40 510 25" />
  </g>

  <!-- LOAF OF BREAD (Top Right above 'ría') -->
  <g>
    <!-- Bread Body -->
    <path d="M 430 95 C 430 75 460 70 490 70 C 520 70 550 75 550 95 C 558 110 552 125 540 125 L 440 125 C 428 125 422 110 430 95 Z" fill="url(#breadGold)"/>
    <!-- Bread Cuts -->
    <path d="M 458 82 Q 466 102 462 114 M 488 80 Q 496 102 492 114 M 518 82 Q 526 102 522 114" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- LOGO TEXT: Panadería Svetlana -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#000000">
    <!-- Stylized Monogram Graphic Wave in Background of P and S -->
    <path d="M 175 125 C 160 145 160 180 190 190 C 220 200 240 165 220 145 C 200 125 185 170 180 220 C 175 260 200 300 245 300 C 270 300 290 285 295 265 C 270 280 245 275 230 255 C 215 235 220 205 245 200 C 275 195 295 225 290 260 C 285 290 250 315 200 315 C 150 315 125 265 140 210 C 150 170 175 140 175 125 Z" fill="url(#breadGold)" opacity="0.85"/>

    <!-- Line 1: Panadería -->
    <text x="175" y="180" font-size="78" letter-spacing="-1">Panadería</text>

    <!-- Line 2: Svetlana -->
    <text x="175" y="275" font-size="82" letter-spacing="-1">Svetlana</text>
  </g>
</svg>
