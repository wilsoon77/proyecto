# Dependencias revisadas que necesitan scripts de instalación para que Next.js
# y la integración opcional de Sentry funcionen en CI y en Vercel.
allowBuilds:
  '@sentry/cli': true
  sharp: true
  unrs-resolver: true

# Parches transitivos verificados contra el registro. Se acotan a la versión
# vulnerable para no sustituir las ramas más nuevas que ya usa Next.js.
overrides:
  brace-expansion@5.0.3: 5.0.7
  fast-uri@3.1.0: 3.1.2
  minimatch@9.0.6: 9.0.7
  picomatch@2.3.1: 2.3.2
  postcss@8.4.31: 8.5.19
  serialize-javascript@6.0.2: 7.0.5
