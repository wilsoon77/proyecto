name: Backend CI (Estable)

on:
  push:
    branches: [main, staging]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: './api/pnpm-lock.yaml'

      - name: Show Node and pnpm versions
        run: |
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Compile backend
        run: pnpm run build

      - name: Generate OpenAPI (smoke check)
        run: pnpm run openapi:gen:dist

      - name: Verify OpenAPI artifact
        run: test -s openapi.json
