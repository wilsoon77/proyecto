<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
    <defs>
        <style>
            /* Animación de la bolsa esperando ser recogida */
            .sucursal-bag {
                animation: floatBag 3s ease-in-out infinite;
                transform-origin: center;
            }
            @keyframes floatBag {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
        </style>
    </defs>

    <!-- Fondo circular -->
    <circle cx="100" cy="100" r="90" fill="#F0F0F0" />
    <circle cx="100" cy="100" r="80" fill="none" stroke="#D1D1D1" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Fachada Tienda (Base) -->
    <rect x="50" y="80" width="100" height="80" fill="#FFFFFF" stroke="#422612" stroke-width="6"/>
    <!-- Puerta -->
    <rect x="65" y="100" width="30" height="60" fill="#EAE0D5" stroke="#422612" stroke-width="4"/>
    <circle cx="90" cy="135" r="2.5" fill="#422612" /> <!-- Manilla -->
    <!-- Ventana -->
    <rect x="105" y="100" width="35" height="35" fill="#A8DADC" stroke="#422612" stroke-width="4"/>
    <line x1="105" y1="117.5" x2="140" y2="117.5" stroke="#422612" stroke-width="3"/>
    <line x1="122.5" y1="100" x2="122.5" y2="135" stroke="#422612" stroke-width="3"/>

    <!-- Toldo de Panadería -->
    <path d="M 40,80 L 55,40 L 145,40 L 160,80" fill="#E74C3C" stroke="#422612" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 40,80 Q 55,95 70,80 Q 85,95 100,80 Q 115,95 130,80 Q 145,95 160,80" fill="#E74C3C" stroke="#422612" stroke-width="6" stroke-linecap="round"/>
    <!-- Franjas Blancas del toldo -->
    <path d="M 70,40 L 60,80 M 100,40 L 100,80 M 130,40 L 140,80" stroke="#FFFFFF" stroke-width="12" />

    <!-- Letrero 'OPEN' -->
    <rect x="85" y="25" width="30" height="15" rx="3" fill="#F4B84A" stroke="#422612" stroke-width="3"/>

    <!-- Bolsa de Pan Flotando (Animada) -->
    <g class="sucursal-bag">
        <!-- Sombra debajo de la bolsa -->
        <ellipse cx="140" cy="165" rx="15" ry="3" fill="#000000" opacity="0.1"/>
        
        <!-- Baguette sobresaliendo -->
        <line x1="135" y1="140" x2="120" y2="105" stroke="#EFA045" stroke-width="12" stroke-linecap="round"/>
        <line x1="135" y1="140" x2="120" y2="105" stroke="#422612" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 100" opacity="0"/> <!-- Helper for outline logic in flat design -->
        <path d="M 125,100 L 135,130" stroke="#422612" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Bolsa -->
        <path d="M 130,160 L 120,120 L 160,120 L 150,160 Z" fill="#D9914A" stroke="#422612" stroke-width="5" stroke-linejoin="round"/>
        <!-- Etiqueta o doblez en la bolsa -->
        <line x1="130" y1="135" x2="150" y2="135" stroke="#422612" stroke-width="3" stroke-linecap="round"/>
    </g>
</svg>